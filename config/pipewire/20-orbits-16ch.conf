## Virtual "Orbits" device: 16 inputs / 16 outputs, from Cagire to Ambivironnement.
##
## Install: copy this file to ~/.config/pipewire/pipewire.conf.d/ and restart PipeWire
## (systemctl --user restart pipewire).
##
## - Cagire (F6 > Audio, PipeWire or JACK driver) plays into the "Orbits" device:
##   orbit n -> channels 2n-1 / 2n (F6 > ROUTING), that is AUX0..AUX15.
## - The 16 outputs "monitor_AUX0..15" go to ambivironnement:in_1L .. in_8R
##   (OUT tab > input <- "Orbits" > connect, orbits mode).

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "orbits-16ch"
            node.description = "Orbits"
            media.class      = "Audio/Sink"
            audio.channels   = 16
            audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7
                                 AUX8 AUX9 AUX10 AUX11 AUX12 AUX13 AUX14 AUX15 ]
            # the device stays there even when nothing is connected to it
            object.linger    = true
            # never become the system's default output
            priority.session = 0
            priority.driver  = 0
        }
    }
]
